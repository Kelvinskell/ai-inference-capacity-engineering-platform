apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: redis-system
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: envoy-ai-gateway
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP