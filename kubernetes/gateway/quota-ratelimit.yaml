apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy-ai-gateway-ratelimit
  namespace: envoy-gateway-system
  labels:
    app.kubernetes.io/name: envoy-ai-gateway-ratelimit
    app.kubernetes.io/part-of: envoy-ai-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: envoy-ai-gateway-ratelimit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: envoy-ai-gateway-ratelimit
        app.kubernetes.io/part-of: envoy-ai-gateway
    spec:
      containers:
        - name: ratelimit
          image: docker.io/envoyproxy/ratelimit:1631871c
          imagePullPolicy: IfNotPresent
          command:
            - /bin/ratelimit
          env:
            - name: LOG_LEVEL
              value: info
            - name: REDIS_SOCKET_TYPE
              value: tcp
            - name: REDIS_URL
              value: redis.redis-system.svc.cluster.local:6379
            - name: RUNTIME_ROOT
              value: /data
            - name: RUNTIME_SUBDIRECTORY
              value: ratelimit
            - name: USE_STATSD
              value: "false"
            - name: CONFIG_TYPE
              value: GRPC_XDS_SOTW
            - name: CONFIG_GRPC_XDS_NODE_ID
              value: envoy-ai-gateway-ratelimit
            - name: CONFIG_GRPC_XDS_SERVER_URL
              value: ai-gateway-controller.envoy-ai-gateway-system.svc.cluster.local:18002
            - name: GRPC_PORT
              value: "8081"
          ports:
            - name: grpc
              containerPort: 8081
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: envoy-ai-gateway-ratelimit
  namespace: envoy-gateway-system
  labels:
    app.kubernetes.io/name: envoy-ai-gateway-ratelimit
    app.kubernetes.io/part-of: envoy-ai-gateway
spec:
  selector:
    app.kubernetes.io/name: envoy-ai-gateway-ratelimit
  ports:
    - name: grpc
      port: 8081
      targetPort: grpc
      protocol: TCP
  type: ClusterIP