apiVersion: batch/v1
kind: Job
metadata:
  name: s3-model-uploader
  namespace: model-storage
  labels:
    app.kubernetes.io/name: s3-model-uploader
    app.kubernetes.io/part-of: model-storage
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 21600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: s3-model-uploader
        app.kubernetes.io/part-of: model-storage
    spec:
      serviceAccountName: model-uploader
      restartPolicy: Never
      containers:
        - name: upload-models
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          env:
            - name: TMPDIR
              value: /workspace
          command:
            - /bin/bash
            - -lc
            - |
              set -euo pipefail
              pip install --no-cache-dir -r /opt/scripts/requirements.txt
              python /opt/scripts/sync_models_to_s3.py
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
              ephemeral-storage: 50Gi
            limits:
              cpu: "4"
              memory: 8Gi
              ephemeral-storage: 60Gi
          volumeMounts:
            - name: uploader-script
              mountPath: /opt/scripts
              readOnly: true
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: uploader-script
          configMap:
            name: model-uploader-script
            defaultMode: 0555
        - name: workspace
          emptyDir:
            sizeLimit: 55Gi